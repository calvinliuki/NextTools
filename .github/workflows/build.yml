name: Build NextTools

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js app (Unix)
      if: matrix.os != 'windows-latest'
      env:
        SKIP_ELECTRON_LOAD: 'true'
        NEXT_TELEMETRY_DISABLED: '1'
      run: npm run build

    - name: Build Next.js app (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      env:
        CI: 'true'
        SKIP_ELECTRON_LOAD: 'true'
        NEXT_TELEMETRY_DISABLED: '1'
        # 禁用 Next.js 文件追踪
        NEXT_PRIVATE_SKIP_FILE_TRACING: '1'
      run: |
        set TEMP=%RUNNER_TEMP%
        set TMP=%RUNNER_TEMP%
        npm run build

    # electron-builder 会自动调用 @electron/rebuild，无需手动执行

    - name: Build Electron app (macOS x64)
      if: matrix.os == 'macos-latest' && matrix.arch == 'x64'
      env:
        SKIP_ELECTRON_LOAD: 'true'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: |
        npx electron-builder --mac --x64

    - name: Build Electron app (macOS arm64)
      if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'
      env:
        SKIP_ELECTRON_LOAD: 'true'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: |
        npx electron-builder --mac --arm64

    - name: Build Electron app (Linux)
      if: matrix.os == 'ubuntu-latest'
      env:
        SKIP_ELECTRON_LOAD: 'true'
      run: |
        npx electron-builder --linux

    - name: Build Electron app (Windows)
      if: matrix.os == 'windows-latest'
      env:
        SKIP_ELECTRON_LOAD: 'true'
      run: |
        npx electron-builder --win

    - name: Upload artifacts (macOS x64)
      if: matrix.os == 'macos-latest' && matrix.arch == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: nexttools-macos-x64
        path: dist-electron/*.dmg
        if-no-files-found: error

    - name: Upload artifacts (macOS arm64)
      if: matrix.os == 'macos-latest' && matrix.arch == 'arm64'
      uses: actions/upload-artifact@v4
      with:
        name: nexttools-macos-arm64
        path: dist-electron/*.dmg
        if-no-files-found: error

    - name: Upload artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nexttools-linux
        path: dist-electron/*.AppImage
        if-no-files-found: error

    - name: Upload artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nexttools-windows
        path: dist-electron/*.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: releases

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/nexttools-macos-x64/*.dmg
          releases/nexttools-macos-arm64/*.dmg
          releases/nexttools-linux/*.AppImage
          releases/nexttools-windows/*.exe
        tag_name: v${{ github.run_number }}
        name: Release ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}